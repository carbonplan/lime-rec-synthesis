[workspace]
name = "lime-rec-synthesis"
description = "Harmonized US liming recommendations: CCE dose vs. pH response"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.2"
openpyxl = "*"
matplotlib = ">=3.10"
jupyterlab = "*"
nbconvert = "*"
xarray = ">=2024.10"
zarr = ">=3"
s3fs = ">=2024.6"

[tasks]
lab = "jupyter lab notebooks"
run-all = { cmd = "jupyter nbconvert --to notebook --execute --inplace 01_harmonize_recs.ipynb 02_limer.ipynb 03_explore.ipynb 04_max_dose.ipynb", cwd = "notebooks" }
